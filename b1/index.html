<!DOCTYPE html><html lang="ur"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#1f4e79"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>KMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial,'Noto Nastaliq Urdu',sans-serif;background:#eef2f6;color:#111}
input,button,select,textarea{font-family:inherit}
.bar button,#set button,.add,.x{line-height:1.9;padding-top:2px!important;padding-bottom:2px!important}
#msg,#tot,#set p,#set label,.hd,.br3.h,.rc .g label{line-height:2}
header{background:#1f4e79;color:#fff;padding:8px 10px;position:sticky;top:0;z-index:5}
header.br{background:#1b7a43}
header h1{margin:0;font-size:18px;line-height:2;display:flex;justify-content:space-between;align-items:center;gap:6px}header .u{font-family:'Noto Nastaliq Urdu',serif;color:#ffe9a8;font-size:15px}
.bar{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}.bar input,.bar button{font-size:16px;padding:6px 8px;border-radius:6px;border:1px solid #9fb3c8}
.bar button{background:#fff;color:#1f4e79;font-weight:bold}.bar button.on{background:#ffd54f;color:#000;border-color:#e0a800}
.tabs button{flex:1;padding:4px 2px;font-size:15px}
#q{flex:1;min-width:110px}#net{font-size:12px;line-height:1.9;padding:0 8px;border-radius:10px;background:#2e8b57}#net.off{background:#c0392b}#net.wait{background:#e67e22}
.row{display:grid;grid-template-columns:30px 1fr 64px 52px 52px;gap:4px;align-items:center;background:#fff;margin:4px 6px;padding:5px 6px;border-radius:8px;border:1px solid #d6dee8}
.done{border-color:#2e8b57!important;background:#effaf2!important}.err{border-color:#c0392b!important;background:#fdecea!important}.wait{border-color:#e67e22!important;background:#fff4e5!important}
.no{font-weight:bold;color:#1f4e79;text-align:center}.nm{font-family:'Noto Nastaliq Urdu',serif;font-size:16px;direction:rtl;text-align:right;line-height:1.9;overflow:hidden;white-space:nowrap}
.nm small{display:block;font-family:Arial;font-size:11px;color:#667;direction:ltr;text-align:left;line-height:1.2}
input.n,select.n{width:100%;font-size:17px;padding:6px 3px;text-align:center;border:1px solid #b9c6d6;border-radius:6px;background:#fff}
.hd{display:grid;grid-template-columns:30px 1fr 64px 52px 52px;gap:4px;margin:6px 6px 0;padding:0 6px;font-size:13px;font-weight:bold;color:#1f4e79;text-align:center}
.rc{background:#fff;margin:6px;padding:7px;border-radius:8px;border:1px solid #d6dee8}
.rc .top{display:flex;gap:5px;align-items:center}.rc .top input{flex:1;font-size:16px;padding:6px;border:1px solid #b9c6d6;border-radius:6px}
.rc .top b{color:#1f4e79;min-width:22px;text-align:center}.rc .x{background:#fdecea;border:1px solid #e3a59d;color:#c0392b;border-radius:6px;font-size:16px;padding:5px 10px}
.rc .g{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px}.rc .g label{font-size:12px;color:#556;text-align:center;display:block}
.add{display:block;margin:8px auto;font-size:16px;padding:9px 22px;border-radius:8px;border:2px dashed #1f4e79;background:#fff;color:#1f4e79;font-weight:bold}
.card{background:#fff;margin:6px;border-radius:10px;border:1px solid #d6dee8;overflow:hidden}
.card h3{margin:0;padding:6px 10px;font-size:15px;color:#fff;background:#1b7a43;display:flex;justify-content:space-between}.card h3 span{font-family:'Noto Nastaliq Urdu',serif;font-weight:normal;color:#ffe9a8}
.kv{display:grid;grid-template-columns:1fr 110px;gap:6px;align-items:center;padding:5px 10px;border-top:1px solid #eef1f4}
.kv .l{font-family:'Noto Nastaliq Urdu',serif;font-size:15px;direction:rtl;text-align:right;line-height:1.8}.kv .l small{font-family:Arial;font-size:11px;color:#778;display:block;direction:ltr;text-align:left;line-height:1.1}
.kv.t{grid-template-columns:1fr}.kv.t input{text-align:right;direction:rtl}
.br3{display:grid;grid-template-columns:1fr 70px 70px 70px;gap:4px;align-items:center;padding:5px 8px;border-top:1px solid #eef1f4}
.br3.h{font-size:12px;font-weight:bold;color:#1b7a43;text-align:center;border:0;padding-bottom:0}
.br3 .l{font-family:'Noto Nastaliq Urdu',serif;font-size:15px;direction:rtl;text-align:right;line-height:1.8;overflow:hidden;white-space:nowrap}
.xr{display:grid;grid-template-columns:26px 1fr 90px;gap:4px;align-items:center;padding:4px 8px;border-top:1px solid #eef1f4}.xr input.d{font-size:15px;padding:6px;border:1px solid #b9c6d6;border-radius:6px;width:100%}
#tot{position:fixed;left:0;right:0;bottom:0;background:#1f4e79;color:#fff;padding:4px 10px;font-size:16px;display:flex;justify-content:space-between}
header.br~#tot{background:#1b7a43}
#msg{font-size:13px;color:#ffe9a8;margin-top:2px;min-height:20px}
#hdslot .hd{margin:4px -4px 0;padding:0 6px;color:#ffe9a8}
.lockbar{margin:6px;padding:4px 10px;border-radius:8px;background:#fdecea;border:1px solid #e3a59d;color:#9b2c1f;font-weight:bold;text-align:center;line-height:2}
#tot{align-items:center}#lkb{font-size:15px;font-weight:bold;border:0;border-radius:8px;padding:2px 12px;line-height:1.9;background:#ffd54f;color:#000}
#lkb.un{background:#fdecea;color:#9b2c1f}
input:disabled,select:disabled{background:#eef1f4!important;color:#333}
#set{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center}
#set .b{background:#fff;border-radius:12px;padding:16px;width:92%;max-width:440px}#set h3{margin:0 0 10px;color:#1f4e79}
#set label{display:block;font-size:14px;font-weight:bold;margin-top:10px}#set input{width:100%;font-size:15px;padding:8px;border:1px solid #9fb3c8;border-radius:6px}
#set .btns{display:flex;gap:8px;margin-top:14px}#set button{flex:1;font-size:16px;padding:9px;border-radius:8px;border:0;background:#1f4e79;color:#fff;font-weight:bold}#set button.g{background:#ccd6e0;color:#111}
#set p{font-size:12px;color:#556;margin:6px 0 0}
</style></head><body>
<header id="hdr"><h1><span><span id="ttl">KMS</span> <span id="net">آن لائن</span></span><span class="u" id="sub">کشمیر ڈیریز جڑانوالہ</span></h1>
<div class="bar" id="bar1"></div>
<div class="bar tabs" id="tabs"></div>
<div class="bar"><input id="q" placeholder="نمبر یا نام تلاش کریں" oninput="draw()"><button onclick="reload()">⟳</button><button onclick="openSet()">⚙</button></div>
<div id="msg"></div><div id="hdslot"></div></header>
<div id="main"></div><div style="height:64px"></div>
<div id="tot"><span id="tl"></span><button id="lkb" onclick="lockBtn()"></button><span id="tc"></span></div>
<div id="set"><div class="b"><h3 id="sT">⚙ سیٹنگ (ایک بار)</h3>
<label>Web app URL  (آخر پر /exec)</label><input id="sU" placeholder="https://script.google.com/macros/s/.../exec">
<label>PIN</label><input id="sP" inputmode="numeric">
<p id="sNote">لنک اور PIN کمپیوٹر کے VMC میں 📲 Mobile سے ملتے ہیں۔ برانچ کا PIN صرف اپنی برانچ کھولتا ہے۔</p>
<div class="btns"><button onclick="saveSet()">محفوظ کریں</button><button class="g" onclick="$('set').style.display='none'">بند</button></div></div></div>
<script>
function $(i){return document.getElementById(i)}
function L(k,d){try{var x=localStorage.getItem(k);return x===null?d:JSON.parse(x)}catch(e){return d}}
function SV(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
var APP=((location.pathname.match(/\/(c|b\d)\/(?:index\.html)?$/i)||[0,'c'])[1]).toLowerCase(),BR=APP=='c'?'':APP.toUpperCase(),P='vmc_'+APP+'_';   // every app keeps its own settings
if(APP=='c'&&!localStorage.getItem(P+'url')){['url','pin'].forEach(function(k){var o=localStorage.getItem('vmc_'+k);if(o)localStorage.setItem(P+k,o)})}   // the first centre app
var U=localStorage.getItem(P+'url')||'',PIN=localStorage.getItem(P+'pin')||'';
(function(){var p=new URLSearchParams(location.search);
 if(p.get('u')){U=p.get('u');localStorage.setItem(P+'url',U);history.replaceState(null,'',location.pathname)}})();
var LK=[],APPC='C',A=L(P+'acc',[]),E={},Q=L(P+'queue',[]).map(function(q){return q.t?q:{t:'e',e:q}}),S={shift:'Morning',kind:'Purchase',btab:'slip'},INFO=L(P+'binfo_'+BR,null),D={};
function msg(t){$('msg').textContent=t}
APPC=BR||'C';
function isLk(){return BR?LK.length>0:(LK.indexOf(S.shift)>=0||LK.indexOf('all')>=0)}
function shN(){return S.shift=='Morning'?'صبح':'شام'}
function loadLocks(){var d=dval();LK=L(P+'lk_'+d,[]);
 return api({api:'locks',app:APPC,date:d}).then(function(r){if(r.ok){LK=r.locks||[];SV(P+'lk_'+d,LK)}}).catch(function(){})}
function lockUi(){var lk=isLk(),b=$('lkb');
 b.textContent=lk?'🔓 تبدیلی (ایڈمن)':('✔ محفوظ کریں'+(BR?'':' — '+shN()));b.className=lk?'un':'';
 if(!lk)return;
 [].forEach.call(document.querySelectorAll('#main input,#main select'),function(i){i.disabled=true});
 [].forEach.call(document.querySelectorAll('#main .add,#main .x'),function(x){x.style.display='none'});
 $('main').insertAdjacentHTML('afterbegin','<div class="lockbar">🔒 یہ '+(BR?'تاریخ':'تاریخ ('+shN()+')')+' محفوظ ہو چکی — صرف دیکھ سکتے ہیں</div>')}
function myQ(){var d=dval();return Q.filter(function(q){return q.t=='b'?(q.b==BR&&q.date==d):(q.e.date==d&&(BR?false:q.e.shift==S.shift))}).length}
function lockBtn(){if(isLk())return unlock();
 if(!navigator.onLine)return alert('محفوظ کرنے کے لیے انٹرنیٹ چاہیے۔');
 if(!confirm((BR?'آج کی تاریخ':shN()+' ('+dval()+')')+' محفوظ کر دیں؟\n\nمحفوظ کرنے کے بعد موبائل پر اس میں تبدیلی نہیں ہو سکے گی، صرف دیکھ سکیں گے۔\n(تبدیلی صرف ایڈمن پاس ورڈ سے)'))return;
 msg('محفوظ ہو رہا ہے...');flush();var t0=Date.now();
 (function wait(){if(myQ()&&Date.now()-t0<40000){flush();return setTimeout(wait,400)}
  if(myQ())return msg('کچھ انٹریاں ابھی نہیں گئیں — انٹرنیٹ دیکھ کر دوبارہ محفوظ دبائیں');
  post({api:'lock',app:APPC,date:dval(),shift:BR?'':S.shift}).then(function(r){if(!r.ok)throw new Error(r.error=='PIN'?'غلط PIN':r.error);
   LK.push(BR?'all':S.shift);SV(P+'lk_'+dval(),LK);msg('✓ محفوظ ہو گیا');draw()}).catch(function(x){msg('محفوظ نہیں ہوا: '+x.message)})})()}
function unlock(){if(!navigator.onLine)return alert('اس کے لیے انٹرنیٹ چاہیے۔');
 var pw=prompt('تبدیلی کے لیے ایڈمن پاس ورڈ لکھیں');if(!pw)return;
 post({api:'unlock',app:APPC,date:dval(),shift:BR?'':S.shift,admin:pw}).then(function(r){
  if(!r.ok)return alert(r.error=='admin'?'ایڈمن پاس ورڈ غلط ہے':'نہیں ہوا: '+r.error);
  LK=LK.filter(function(x){return BR?false:(x!=S.shift&&x!='all')});SV(P+'lk_'+dval(),LK);msg('🔓 کھل گیا — تبدیلی کر کے دوبارہ محفوظ کریں');draw()}).catch(function(x){alert('نہیں ہوا: '+x.message)})}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function dval(){return $('d')?$('d').value:''}
function net(){var n=$('net');if(!navigator.onLine){n.className='off';n.textContent='آف لائن'}else if(Q.length){n.className='wait';n.textContent=Q.length+' باقی'}else{n.className='';n.textContent='آن لائن'}}
function showSet(){$('sU').value=U;$('sP').value=PIN;$('set').style.display='flex'}
function openSet(){if(!U||!PIN||PINBAD)return showSet();   // first time: the link and PIN go in
 if(!navigator.onLine)return alert('سیٹنگ کے لیے انٹرنیٹ چاہیے (ایڈمن پاس ورڈ گوگل سے چیک ہوتا ہے)۔');
 var pw=prompt('سیٹنگ صرف ایڈمن — ایڈمن پاس ورڈ لکھیں');if(!pw)return;
 post({api:'checkadmin',app:APPC,admin:pw}).then(function(r){if(r.ok)showSet();else alert(r.error=='admin'?'ایڈمن پاس ورڈ غلط ہے':'نہیں ہوا: '+(r.error=='PIN'?'PIN غلط':r.error))})
  .catch(function(x){alert('نہیں ہوا: '+x.message)})}
function saveSet(){U=$('sU').value.trim();PIN=$('sP').value.trim();localStorage.setItem(P+'url',U);localStorage.setItem(P+'pin',PIN);$('set').style.display='none';reload()}
function api(params){return fetch(U+(U.indexOf('?')<0?'?':'&')+new URLSearchParams(Object.assign({pin:PIN},params))).then(function(r){return r.json()})}
function post(body){body.pin=PIN;return fetch(U,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)}).then(function(r){return r.json()})}
function isNum(x){return x===''||!isNaN(Number(String(x).replace(',','.')))}
function nv(x){x=String(x).trim().replace(',','.');return x===''?'':Number(x)}
function uid(){return 'm'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function today(){var t=new Date();return t.getFullYear()+'-'+('0'+(t.getMonth()+1)).slice(-2)+'-'+('0'+t.getDate()).slice(-2)}
/* ================= layout ================= */
var KINDS=[['Purchase','پرچیز'],['Sale','سیل'],['Random Purchase','ر۔ پرچیز'],['Random Sale','ر۔ سیل']];
var BTABS=[['slip','سلپ و سیل'],['cust','ادھار گاہک'],['acc','خرچے / ملازم'],['extra','ایکسٹرا']];
function build(){var h=$('hdr'),d=dval()||today();$('sT').textContent='⚙ سیٹنگ  —  '+(BR?('KMS '+BR):'KMS سنٹر');
 h.className=BR?'br':'';
 $('ttl').textContent=BR?('KMS '+BR):'KMS سنٹر';$('sub').textContent=BR&&INFO&&INFO.urdu?INFO.urdu:'کشمیر ڈیریز جڑانوالہ';
 $('bar1').innerHTML='<input type="date" id="d" value="'+d+'">'+(BR?'':'<button id="bM" onclick="setShift(\'Morning\')">صبح</button><button id="bE" onclick="setShift(\'Evening\')">شام</button>');
 $('d').addEventListener('change',reload);
 $('tabs').innerHTML=(BR?BTABS:KINDS).map(function(k){return '<button data-k="'+k[0]+'" onclick="setTab(this.dataset.k)">'+k[1]+'</button>'}).join('');
 marks();draw()}
function marks(){if(!BR){$('bM').className=S.shift=='Morning'?'on':'';$('bE').className=S.shift=='Evening'?'on':''}
 var cur=BR?S.btab:S.kind;[].forEach.call($('tabs').children,function(b){b.className=b.dataset.k==cur?'on':''})}
function setShift(s){S.shift=s;marks();draw()}
function setShiftL(s){setShift(s)}
function setTab(k){if(BR)S.btab=k;else S.kind=k;$('q').value='';marks();draw()}
/* ================= load ================= */
function reload(){if(!U||!PIN){openSet();return}
 msg('لوڈ ہو رہا ہے...');var d=dval();
 if(BR){
  api({api:'binit',b:BR}).then(function(r){if(!r.ok)throw new Error(r.error=='PIN'?'غلط PIN':(r.error=='branch'?'یہ برانچ ابھی نہیں بھیجی گئی (کمپیوٹر: Send account list)':r.error));
    INFO=r.info;SV(P+'binfo_'+BR,INFO);$('sub').textContent=INFO.urdu||'کشمیر ڈیریز جڑانوالہ';return api({api:'bentries',b:BR,date:d})})
   .then(function(r){if(!r)return;if(!r.ok)throw new Error(r.error);D=r.data||{};pendingInto();SV(P+'bd_'+BR+'_'+d,D);return loadLocks()}).then(function(){PINBAD=false;if(INFO){msg('');draw();flush()}})
   .catch(function(x){D=L(P+'bd_'+BR+'_'+d,{});LK=L(P+'lk_'+d,[]);pendingInto();draw();offMsg(x)});
  return}
 api({api:'accounts'}).then(function(r){if(!r.ok)throw new Error(r.error=='PIN'?'غلط PIN':r.error);A=r.accounts||[];SV(P+'acc',A);
   if(!A.length)msg('اکاؤنٹ لسٹ خالی: کمپیوٹر سے "Send account list" دبائیں');return api({api:'entries',date:d})})
  .then(function(r){if(!r)return;E={};(r.entries||[]).forEach(function(e){E[ekey(e)]=e});pendingInto();SV(P+'E_'+d,E);return loadLocks()}).then(function(){PINBAD=false;if(A.length)msg('');draw();flush()})
  .catch(function(x){E=L(P+'E_'+d,{});LK=L(P+'lk_'+d,[]);pendingInto();draw();offMsg(x)})}
function offMsg(x){msg(navigator.onLine?('غلطی: '+x.message+' (⚙ میں لنک / PIN دیکھیں)'):'انٹرنیٹ نہیں — انٹری کرتے جائیں، انٹرنیٹ آتے ہی خود چلی جائیں گی');
 if(navigator.onLine&&/PIN/.test(x.message)){PINBAD=true}}
var PINBAD=false;
function ekey(e){return e.id?('id|'+e.id):(e.date+'|'+e.shift+'|'+e.kind+'|'+e.name)}
function pendingInto(){var d=dval();Q.forEach(function(q){
  if(q.t=='b'){if(q.b==BR&&q.date==d)for(var k in q.kv)D[k]=q.kv[k]}
  else if(q.e.date==d){if(q.e.del)delete E[ekey(q.e)];else E[ekey(q.e)]=q.e}})}
/* ================= queue: saved in the phone, sent when online ================= */
function push(item){
 if(item.t=='b'){var o=Q.find(function(q){return q.t=='b'&&q.b==item.b&&q.date==item.date&&q!==Q[0]});if(o){for(var k in item.kv)o.kv[k]=item.kv[k]}else Q.push(item)}
 else{Q=Q.filter(function(q,i){return i===0||q.t!='e'||ekey(q.e)!==ekey(item.e)});Q.push(item)}
 SV(P+'queue',Q);net();flush()}
var busy=false;
function flush(){if(busy||!Q.length||!navigator.onLine||!U)return;busy=true;var it=Q[0];
 var p=it.t=='b'?post({api:'bsave',b:it.b,date:it.date,kv:it.kv}):post({api:'save',entry:it.e});
 p.then(function(r){
   if(!r.ok&&r.error=='locked'){Q.shift();SV(P+'queue',Q);busy=false;net();msg('🔒 یہ تاریخ محفوظ ہو چکی — یہ انٹری نہیں گئی');loadLocks().then(draw);return flush()}
   if(!r.ok)throw new Error(r.error=='PIN'?'غلط PIN':String(r.error));
   Q.shift();SV(P+'queue',Q);busy=false;net();msg('✓ محفوظ');paint();flush()})
  .catch(function(x){busy=false;net();msg((navigator.onLine?'ابھی نہیں گئی: '+x.message:'انٹرنیٹ نہیں')+' — '+Q.length+' انٹری موبائل میں محفوظ، خود چلی جائیں گی');setTimeout(flush,15000)})}
function waiting(fn){return Q.some(fn)}
/* ================= draw ================= */
function draw(){$('hdslot').innerHTML='';if(BR)drawBranch();else if(S.kind.indexOf('Random')===0)drawRandom();else drawMain();lockUi()}
function wire(root){[].forEach.call((root||document).querySelectorAll(root?'input,select':'#main input,#main select'),wireEl);order()}
/* Next / Enter goes to the box BELOW: in a table the boxes are numbered column by column
   (milk of all rows, then fat ...); Extra and Random cards stay line by line */
function order(){var seq=[],groups=[];
 if(BR)[].forEach.call(document.querySelectorAll('#main .card'),function(c){groups.push([].slice.call(c.querySelectorAll('.kv,.br3,.xr')))});
 else groups.push([].slice.call(document.querySelectorAll('#main .row,#main .rc')));
 groups.forEach(function(rows){
  var cells=rows.map(function(r){return [].slice.call(r.querySelectorAll('input,select'))});
  if(rows.length&&(rows[0].classList.contains('xr')||rows[0].classList.contains('rc'))){cells.forEach(function(c){seq=seq.concat(c)});return}   // Extra / Random cards: in their own order (name, then its boxes)
  var n=Math.max.apply(null,[0].concat(cells.map(function(c){return c.length})));
  for(var j=0;j<n;j++)cells.forEach(function(c){if(c[j])seq.push(c[j])})});
 seq.forEach(function(el,i){el.tabIndex=i+1;el.setAttribute('enterkeyhint',i<seq.length-1?'next':'done')});
 ORDER=seq}
var ORDER=[];
function wireEl(i){
  i.addEventListener('change',function(){onEdit(i)});
  i.addEventListener('focus',function(){try{i.select()}catch(e){}});
  i.addEventListener('keydown',function(ev){if(ev.key!=='Enter')return;ev.preventDefault();
   var k=ORDER.indexOf(i);
   i.blur();   // the value is saved now (and a new Extra line may come)
   var nx=ORDER[k+1];
   if(nx&&!nx.disabled)nx.focus();else{var a=document.querySelector('#main .add');if(a)a.click()}})}
function xRow(i){return '<div class="xr" data-row="x'+i+'"><b style="color:#1b7a43;text-align:center">'+i+'</b><input class="d" data-k="x'+i+'_d" placeholder="تفصیل" value="'+esc(D['x'+i+'_d']||'')+'"><input class="n" inputmode="decimal" data-k="x'+i+'_a" value="'+esc(D['x'+i+'_a']||'')+'"></div>'}
function onEdit(i){if(BR)return bEdit(i);if(i.closest('.rc'))return rEdit(i.closest('.rc'));mEdit(i.closest('.row'))}
/* ---- Purchase / Sale ---- */
function drawMain(){var q=$('q').value.trim().toLowerCase(),h='',d=dval();
 h='';$('hdslot').innerHTML='<div class="hd"><span>#</span><span>نام</span><span>دودھ</span><span>فیٹ</span><span>LR</span></div>';   // stays visible (in the fixed header)
 A.filter(function(a){return a.kind==S.kind&&(!a.shift||a.shift==S.shift)}).forEach(function(a){
  if(q&&String(a.no)!==q&&a.name.toLowerCase().indexOf(q)<0&&String(a.urdu).indexOf(q)<0)return;
  var e=E[d+'|'+S.shift+'|'+S.kind+'|'+a.name]||{},v=function(x){return x===''||x==null?'':x};
  h+='<div class="row" data-n="'+encodeURIComponent(a.name)+'"><span class="no">'+a.no+'</span><span class="nm">'+esc(a.urdu||a.name)+'<small>'+esc(a.name)+'</small></span>'+
   '<input class="n" inputmode="decimal" data-f="milk" value="'+v(e.milk)+'"><input class="n" inputmode="decimal" data-f="fat" value="'+v(e.fat)+'"><input class="n" inputmode="decimal" data-f="lr" value="'+v(e.lr)+'"></div>'});
 $('main').innerHTML=h+(A.some(function(a){return a.kind==S.kind})?'':'<p style="text-align:center;color:#667">⟳ دبائیں</p>');wire();paint()}
function mEdit(r){var n=decodeURIComponent(r.dataset.n),f={};r.querySelectorAll('input').forEach(function(i){f[i.dataset.f]=i.value.trim()});
 for(var k in f)if(!isNum(f[k])){r.className='row err';msg('غلط نمبر: '+f[k]);return}
 var e={date:dval(),shift:S.shift,kind:S.kind,name:n,milk:nv(f.milk),fat:nv(f.fat),lr:nv(f.lr)};E[ekey(e)]=e;push({t:'e',e:e})}
/* ---- Random: as many lines as needed ---- */
function rList(){var d=dval();return Object.keys(E).map(function(k){return E[k]}).filter(function(e){return e.id&&e.date==d&&e.shift==S.shift&&e.kind==S.kind})}
function drawRandom(){var q=$('q').value.trim().toLowerCase(),acc=A.filter(function(a){return a.kind==S.kind}),h='<datalist id="rl">'+acc.map(function(a){return '<option value="'+esc(a.name)+'">'}).join('')+'</datalist>';
 var pk=S.kind=='Random Purchase'?'ادائیگی':'وصولی';
 rList().forEach(function(e,i){if(q&&String(e.name).toLowerCase().indexOf(q)<0)return;h+=rCard(e,i+1,pk)});
 h+='<button class="add" onclick="rAdd()">+ نئی لائن</button>';$('main').innerHTML=h;wire();paint()}
function rCard(e,no,pk){var v=function(x){return x===''||x==null?'':x};
 return '<div class="rc" data-id="'+esc(e.id)+'"><div class="top"><b>'+no+'</b><input list="rl" data-f="name" placeholder="نام" value="'+esc(e.name)+'"><button class="x" onclick="rDel(this)">✕</button></div>'+
  '<div class="g"><span><label>دودھ</label><input class="n" inputmode="decimal" data-f="milk" value="'+v(e.milk)+'"></span><span><label>فیٹ</label><input class="n" inputmode="decimal" data-f="fat" value="'+v(e.fat)+'"></span>'+
  '<span><label>LR</label><input class="n" inputmode="decimal" data-f="lr" value="'+v(e.lr)+'"></span><span><label>ریٹ</label><input class="n" inputmode="decimal" data-f="rate" value="'+v(e.rate)+'"></span>'+
  '<span><label>'+pk+'</label><input class="n" inputmode="decimal" data-f="pay" value="'+v(e.pay)+'"></span></div></div>'}
function rAdd(){if(isLk())return;var e={id:uid(),date:dval(),shift:S.shift,kind:S.kind,name:'',milk:'',fat:'',lr:'',rate:'',pay:''};E[ekey(e)]=e;drawRandom();
 var c=document.querySelector('.rc[data-id="'+e.id+'"] input');if(c)c.focus()}
function rEdit(c){var id=c.dataset.id,old=E['id|'+id]||{},f={};c.querySelectorAll('input').forEach(function(i){f[i.dataset.f]=i.value.trim()});
 for(var k in f)if(k!='name'&&!isNum(f[k])){c.classList.add('err');msg('غلط نمبر: '+f[k]);return}
 if(f.name&&f.rate===''){var a=A.find(function(a){return a.kind==S.kind&&a.name==f.name});if(a&&a.rate){f.rate=String(a.rate);c.querySelector('[data-f=rate]').value=f.rate}}
 var e={id:id,date:old.date||dval(),shift:old.shift||S.shift,kind:old.kind||S.kind,name:f.name,milk:nv(f.milk),fat:nv(f.fat),lr:nv(f.lr),rate:nv(f.rate),pay:nv(f.pay)};
 E['id|'+id]=e;if(!f.name){c.classList.add('wait');msg('نام لکھیں');counts();return}push({t:'e',e:e})}
function rDel(b){var c=b.closest('.rc'),id=c.dataset.id,e=E['id|'+id];if(!confirm('یہ لائن مٹا دیں؟'))return;delete E['id|'+id];
 if(e&&e.name)push({t:'e',e:{id:id,del:true,date:e.date,shift:e.shift,kind:e.kind,name:e.name}});drawRandom()}
/* ---- Branch ---- */
var TXT=/^(note|x\d+_d|a:\d+:(note|att))$/;
function kv(k,cap,ur,txt){var v=D[k]==null?'':D[k];
 return '<div class="kv'+(txt?' t':'')+'">'+(txt?'':'<span class="l">'+ur+'<small>'+cap+'</small></span>')+'<input class="n" '+(txt?'placeholder="'+ur+'"':'inputmode="decimal"')+' data-k="'+k+'" value="'+esc(v)+'"></div>'}
function card(t,ur,body){return '<div class="card"><h3>'+t+'<span>'+ur+'</span></h3>'+body+'</div>'}
function drawBranch(){if(!INFO){$('main').innerHTML='<p style="text-align:center;color:#667">⟳ دبائیں</p>';return}
 var h='',q=$('q').value.trim().toLowerCase();
 if(S.btab=='slip'){
  h+=card('Milk slip','دودھ کی سلپ',kv('dahi','D  Dahi (L)','دہی')+kv('thanda','T  Thanda (L)','ٹھنڈا')+kv('karai','KR  Karai (L)','کڑاہی')+kv('k_f','F  morning kacha (L)','صبح کچا')+kv('k_se','SE  evening milk (L)','شام دودھ'));
  [['k','Kacha','کچا'],['d','Dahi','دہی'],['t','Thanda','ٹھنڈا'],['kr','Karai','کڑاہی']].forEach(function(p){var k=p[0],b='';
   if(k=='t')b+=kv('t_after','After boiled (L)','اُبالنے کے بعد');
   b+=kv(k+'_notsold','Not sold (L / kg)','نہیں بکا');
   if(k!='k'||INFO.kudhar!='customers'){b+=kv(k+'_udhar','Udhar (L / kg)','ادھار');b+=kv(k+'_rec','Udhar receiving (Rs)','ادھار وصولی')}
   if(k=='t'||k=='kr')b+=kv(k+'_free','Free (Rs)','فری');
   b+=kv(k+'_sale','Sale in hand (Rs)','ہاتھ میں سیل');h+=card(p[1],p[2],b)});
  h+=card('Cash','نقدی',kv('milk_pay','Milk payment to Main (Rs)','مین کو دودھ کی ادائیگی')+kv('note','Note','نوٹ',true))}
 else if(S.btab=='cust'){var cs=(INFO.customers||[]);
  h+='<div class="card"><h3>Udhar customers<span>ادھار گاہک</span></h3><div class="br3 h"><span>نام</span><span>دودھ L</span><span>ٹھنڈا Rs</span><span>وصولی Rs</span></div>';
  cs.forEach(function(c){if(q&&String(c.name).toLowerCase().indexOf(q)<0&&String(c.urdu).indexOf(q)<0)return;var p='c:'+c.id+':',v=function(k){return esc(D[p+k]==null?'':D[p+k])};
   h+='<div class="br3" data-row="'+p+'"><span class="l">'+esc(c.urdu||c.name)+'</span><input class="n" inputmode="decimal" data-k="'+p+'milk" value="'+v('milk')+'"><input class="n" inputmode="decimal" data-k="'+p+'thanda" value="'+v('thanda')+'"><input class="n" inputmode="decimal" data-k="'+p+'wasooli" value="'+v('wasooli')+'"></div>'});
  h+=(cs.length?'':'<p style="padding:8px;color:#667">کوئی گاہک نہیں</p>')+'</div>'}
 else if(S.btab=='acc'){var ac=INFO.accounts||[];
  [['Employee','Employees','ملازم'],['Expense','Expenses','خرچے'],['Other','Accounts / Partners','اکاؤنٹ / پارٹنر']].forEach(function(g){
   var rows=ac.filter(function(a){return g[0]=='Other'?(a.kind!='Employee'&&a.kind!='Expense'):a.kind==g[0]});if(!rows.length)return;
   var hd=g[0]=='Employee'?['حاضری','ادائیگی Rs','']:(g[0]=='Expense'?['آج خرچ Rs','نوٹ','']:['دیا Rs','لیا Rs','']);
   var b='<div class="br3 h"><span>نام</span><span>'+hd[0]+'</span><span>'+hd[1]+'</span><span></span></div>';
   rows.forEach(function(a){if(q&&String(a.name).toLowerCase().indexOf(q)<0&&String(a.urdu).indexOf(q)<0)return;var p='a:'+a.id+':',v=function(k){return esc(D[p+k]==null?'':D[p+k])};
    b+='<div class="br3" data-row="'+p+'"><span class="l">'+esc(a.urdu||a.name)+'</span>';
    if(g[0]=='Employee'){var at=D[p+'att']||'';b+='<select class="n" data-k="'+p+'att">'+['','P','H','A','Leave'].map(function(o){return '<option'+(o==at?' selected':'')+'>'+o+'</option>'}).join('')+'</select><input class="n" inputmode="decimal" data-k="'+p+'pay" value="'+v('pay')+'"><span></span>'}
    else if(g[0]=='Expense')b+='<input class="n" inputmode="decimal" data-k="'+p+'pay" value="'+v('pay')+'"><input class="n" style="grid-column:span 2;text-align:right" data-k="'+p+'note" value="'+v('note')+'">';
    else b+='<input class="n" inputmode="decimal" data-k="'+p+'pay" value="'+v('pay')+'"><input class="n" inputmode="decimal" data-k="'+p+'receive" value="'+v('receive')+'"><span></span>';
    b+='</div>'});
   h+=card(g[1],g[2],b)});
  if(ac.some(function(a){return a.kind=='Employee'}))h+='<p style="font-size:12px;color:#556;margin:4px 10px">حاضری: P = حاضر، H = آدھا دن، A = غیر حاضر، Leave = چھٹی</p>'}
 else{var n=10;for(var i=1;i<=30;i++)if((D['x'+i+'_d']||'')!==''||(D['x'+i+'_a']||'')!=='')n=Math.max(n,i+1);n=Math.min(30,n);var b='';
  for(var i=1;i<=n;i++)b+=xRow(i);
  h+=card('Extra (detail)','ایکسٹرا',b)}
 $('main').innerHTML=h;wire();paint()}
function bEdit(i){var k=i.dataset.k,v=i.value.trim();if(!TXT.test(k)&&!isNum(v)){i.classList.add('err');msg('غلط نمبر: '+v);return}
 if(!TXT.test(k)&&v!=='')v=String(nv(v));i.classList.remove('err');D[k]=v;var o={};o[k]=v;SV(P+'bd_'+BR+'_'+dval(),D);push({t:'b',b:BR,date:dval(),kv:o});
 if(S.btab=='extra'&&/^x\d+_/.test(k)){var m=+k.match(/\d+/)[0],cur=i.closest('.xr');   // the last line used: one more line under it (up to 30), cursor stays
  if(m>=10&&m<30&&cur&&!document.querySelector('[data-k="x'+(m+1)+'_d"]')){cur.insertAdjacentHTML('afterend',xRow(m+1));wire(cur.nextElementSibling)}}}
/* ---- colours (green saved / orange waiting) and totals ---- */
function paint(){var d=dval();
 if(BR){var pend={};Q.forEach(function(q){if(q.t=='b'&&q.b==BR&&q.date==d)for(var k in q.kv)pend[k]=1});
  document.querySelectorAll('#main [data-k]').forEach(function(i){if(i.tagName!='INPUT'&&i.tagName!='SELECT')return;var k=i.dataset.k;i.classList.remove('wait','done');
   if(pend[k])i.classList.add('wait');else if((D[k]||'')!=='')i.classList.add('done')});counts();return}
 document.querySelectorAll('#main .row').forEach(function(r){var n=decodeURIComponent(r.dataset.n),e=E[d+'|'+S.shift+'|'+S.kind+'|'+n];
  var w=waiting(function(q){return q.t=='e'&&!q.e.id&&q.e.date==d&&q.e.shift==S.shift&&q.e.kind==S.kind&&q.e.name==n});
  r.className='row'+(w?' wait':(e&&e.milk!==''&&e.milk!=null?' done':''))});
 document.querySelectorAll('#main .rc').forEach(function(c){var id=c.dataset.id,w=waiting(function(q){return q.t=='e'&&q.e.id==id});
  c.classList.remove('wait','done');var e=E['id|'+id];if(w||!(e&&e.name))c.classList.add('wait');else c.classList.add('done')});counts()}
function counts(){var d=dval(),c=0,t=0,lab='';
 if(BR){var f=function(re){var s=0;for(var k in D)if(re.test(k))s+=Number(D[k])||0;return s};
  if(S.btab=='cust'){lab='گاہکوں کو ادھار دودھ';t=f(/^c:\d+:milk$/)}else if(S.btab=='acc'){lab='کل ادائیگی';t=f(/^a:\d+:pay$/)}
  else if(S.btab=='extra'){lab='ایکسٹرا کل';t=f(/^x\d+_a$/)}else{lab='ہاتھ میں سیل کل';t=f(/^(k|d|t|kr)_sale$/)}
  $('tl').textContent=lab;$('tc').textContent=Math.round(t*10)/10;return}
 var rnd=S.kind.indexOf('Random')===0;
 for(var k in E){var e=E[k];if(e.date==d&&e.shift==S.shift&&e.kind==S.kind&&(rnd?e.id:!e.id)&&e.milk!==''&&e.milk!=null){c++;t+=Number(e.milk)||0}}
 $('tl').textContent=(S.shift=='Morning'?'صبح':'شام')+' '+KINDS.find(function(x){return x[0]==S.kind})[1]+':  '+c+(rnd?' لائن':' اکاؤنٹ');$('tc').textContent='کل دودھ '+(Math.round(t*10)/10)}
window.addEventListener('online',function(){net();flush()});window.addEventListener('offline',net);
(function(){if(new Date().getHours()>=13)S.shift='Evening';build();reload();setInterval(flush,20000);net();
 if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')})();
